<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALP EREN KESİM SKOR TABLOSU</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --delete-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: var(--text-color);
            letter-spacing: 1px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button.add-btn {
            padding: 12px 24px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button.add-btn:hover {
            background-color: var(--accent-hover);
        }

        button.add-btn:active {
            transform: scale(0.98);
        }

        .scoreboard-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Scrollbar stilleri */
        .scoreboard-list::-webkit-scrollbar {
            width: 6px;
        }
        .scoreboard-list::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 3px;
        }

        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #334155;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .player-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .player-name {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .click-tip {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .score-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-color);
            min-width: 50px;
            text-align: center;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .plus-btn {
            padding: 8px 16px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .plus-btn:hover {
            background-color: #16a34a;
        }

        .delete-btn {
            padding: 8px 12px;
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background-color: var(--delete-color);
            color: white;
            border-color: var(--delete-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ALP EREN KESİM SKOR TABLOSU</h1>
        
        <div class="input-area">
            <input type="text" id="playerNameInput" placeholder="Oyuncu adı girin..." autocomplete="off">
            <button class="add-btn" onclick="addPlayer()">Ekle</button>
        </div>

        <div class="scoreboard-list" id="scoreboardList">
            <!-- Oyuncular buraya dinamik olarak eklenecek -->
        </div>
    </div>

    <script>
        // Tarayıcı hafızasından verileri çek, yoksa boş dizi oluştur
        let players = JSON.parse(localStorage.getItem('scoreboard_players')) || [];

        // Sayfa yüklendiğinde listeyi göster
        document.addEventListener('DOMContentLoaded', renderScoreboard);

        // Enter tuşuna basınca da ekleme yapabilmek için
        document.getElementById('playerNameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addPlayer();
            }
        });

        // Yeni Oyuncu Ekleme Fonksiyonu
        function addPlayer() {
            const input = document.getElementById('playerNameInput');
            const name = input.value.trim();

            if (name === '') {
                alert('Lütfen geçerli bir isim girin!');
                return;
            }

            const newPlayer = {
                id: Date.now(),
                name: name,
                score: 0
            };

            players.push(newPlayer);
            saveAndRender();
            input.value = ''; // Giriş alanını temizle
            input.focus();
        }

        // Skoru 1 Artırma Fonksiyonu
        function increaseScore(id, event) {
            // Eğer silme butonuna tıklandıysa skoru artırma
            if (event.target.classList.contains('delete-btn') || event.target.closest('.delete-btn')) {
                return;
            }

            players = players.map(player => {
                if (player.id === id) {
                    return { ...player, score: player.score + 1 };
                }
                return player;
            });
            saveAndRender();
        }

        // Oyuncu Silme Fonksiyonu
        function deletePlayer(id) {
            players = players.filter(player => player.id !== id);
            saveAndRender();
        }

        // Verileri Kaydet ve Listeyi Yenile
        function saveAndRender() {
            localStorage.setItem('scoreboard_players', JSON.stringify(players));
            renderScoreboard();
        }

        // Listeyi Ekrana Basma Fonksiyonu
        function renderScoreboard() {
            const listContainer = document.getElementById('scoreboardList');
            listContainer.innerHTML = '';

            // Skorlara göre büyükten küçüğe sırala (İstersen bu satırı silebilirsin)
            players.sort((a, b) => b.score - a.score);

            if (players.length === 0) {
                listContainer.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 20px;">Henüz kimse eklenmedi.</p>`;
                return;
            }

            players.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.onclick = (e) => increaseScore(player.id, e);

                card.innerHTML = `
                    <div class="player-info">
                        <span class="player-name">${player.name}</span>
                        <span class="click-tip">Yükseltmek için tıkla</span>
                    </div>
                    <div class="score-section">
                        <span class="score-display">${player.score}</span>
                        <div class="action-btns">
                            <button class="plus-btn">+1</button>
                            <button class="delete-btn" onclick="deletePlayer(${player.id})">Sil</button>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
