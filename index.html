<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renkli Defter</title>
    <style>
        /* --- GENEL AYARLAR --- */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #4ca771; /* Görseldeki yeşil tonu */
            font-family: 'Nunito', sans-serif;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- ANA KONTEYNER --- */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* --- SOL TARAF (LOGO VE YAZI) --- */
        .left-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 40px;
        }

        .title-renkli {
            background-color: #ffd13b;
            color: #ff5722;
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 3.5rem;
            font-weight: 900;
            border: 3px solid #000;
            transform: rotate(-4deg);
            margin-bottom: -10px;
            box-shadow: 4px 4px 0px #000;
            letter-spacing: 2px;
            -webkit-text-stroke: 1px #000;
        }

        .title-defter {
            background-color: #fff8dc;
            color: #f44336;
            padding: 10px 40px;
            border-radius: 50px;
            font-size: 2.2rem;
            font-weight: 900;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            letter-spacing: 2px;
            -webkit-text-stroke: 1px #000;
            z-index: 2;
        }

        .subtitle {
            font-size: 2rem;
            font-weight: 900;
            margin-top: 40px;
            line-height: 1.4;
        }

        /* --- SAĞ TARAF (BUTONLAR) --- */
        .right-side {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            background-color: #fff8dc;
            color: #000;
            border: 3px solid #000;
            border-radius: 5px;
            padding: 20px 30px;
            font-size: 1.4rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-decoration: none;
        }

        .btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 7px 7px 0px #000;
            background-color: #fff;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        .btn-icon {
            font-size: 1.8rem;
            background-color: #81d4fa;
            border: 2px solid #000;
            border-radius: 5px;
            padding: 5px 10px;
        }

        /* 6, 7 ve 8. Sınıf Butonları İçin Özel Ayar */
        .btn-class {
            justify-content: center;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Mobil Uyumluluk */
        @media (max-width: 768px) {
            .right-side {
                grid-template-columns: 1fr;
            }
            .title-renkli { font-size: 2.5rem; }
            .title-defter { font-size: 1.8rem; }
            .subtitle { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="left-side">
            <div class="title-renkli">RENKLİ</div>
            <div class="title-defter">DEFTER</div>
            <div class="subtitle">
                6, 7, 8 Sınıflar İçin<br>
                PDF'ler Bulunur
            </div>
        </div>

        <div class="right-side">
            <a href="#" class="btn">
                <span class="btn-icon">📝</span>
                Notlar
            </a>
            <a href="#" class="btn">
                <span class="btn-icon">📋</span>
                Yazılı Hazırlık
            </a>
            <a href="#" class="btn btn-class">6. Sınıf</a>
            <a href="#" class="btn btn-class">7. Sınıf</a>
            <a href="#" class="btn btn-class" style="grid-column: span 2; max-width: 300px; margin: 0 auto; width: 100%;">8. Sınıf [LGS]</a>
        </div>
    </div>

    <footer>
        BY: ALP EREN
    </footer>

</body>
</html>
