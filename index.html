<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renkli Defterim | Gelişmiş PDF Platformu</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #10b981;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --card-bg: #ffffff;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--light); color: var(--dark); padding-bottom: 50px; }

        /* Navbar */
        .navbar {
            background: var(--primary); color: white; padding: 20px 5%;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100;
        }
        .navbar h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        /* Upload Section */
        .upload-card {
            background: var(--card-bg); border-radius: var(--radius); padding: 30px;
            box-shadow: var(--shadow); margin-bottom: 40px; border: 1px solid var(--border);
        }
        .upload-header { font-size: 1.25rem; font-weight: bold; margin-bottom: 20px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        input, select, textarea {
            padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 0.95rem; outline: none; transition: var(--transition); background: var(--light);
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        .file-drop-area {
            border: 2px dashed var(--primary); border-radius: 12px; padding: 40px 20px;
            text-align: center; cursor: pointer; transition: var(--transition); background: rgba(79, 70, 229, 0.02);
        }
        .file-drop-area:hover { background: rgba(79, 70, 229, 0.08); }
        .file-drop-area i { font-size: 3rem; color: var(--primary); margin-bottom: 10px; }
        .file-drop-area .file-name { color: var(--secondary); font-weight: bold; margin-top: 10px; display: none; }

        .btn {
            padding: 14px 24px; border: none; border-radius: 8px; font-weight: 600;
            cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }

        /* Progress Bar */
        .progress-container { width: 100%; height: 8px; background: var(--border); border-radius: 10px; overflow: hidden; margin-top: 20px; display: none; }
        .progress-bar { height: 100%; width: 0%; background: var(--secondary); transition: width 0.2s ease; }

        /* Filter Section */
        .filter-section {
            display: flex; gap: 15px; margin-bottom: 30px; background: var(--card-bg);
            padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow);
            align-items: center; flex-wrap: wrap;
        }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--gray); }
        .search-box input { width: 100%; padding-left: 40px; }

        /* PDF Grid */
        .pdf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        
        .pdf-card {
            background: var(--card-bg); border-radius: var(--radius); padding: 25px;
            box-shadow: var(--shadow); transition: var(--transition); border: 1px solid var(--border);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .pdf-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary); }
        .pdf-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        
        .pdf-badges { display: flex; gap: 8px; margin-bottom: 15px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .badge-grade { background: rgba(79, 70, 229, 0.1); color: var(--primary); }
        .badge-subject { background: rgba(16, 185, 129, 0.1); color: var(--secondary); }
        
        .pdf-title { font-size: 1.2rem; margin-bottom: 10px; color: var(--dark); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .pdf-desc { font-size: 0.9rem; color: var(--gray); margin-bottom: 20px; flex: 1; }
        
        .pdf-actions { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-action { flex: 1; padding: 10px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 5px; transition: var(--transition); border: none; cursor: pointer; }
        .btn-view { background: rgba(16, 185, 129, 0.1); color: var(--secondary); }
        .btn-view:hover { background: var(--secondary); color: white; }
        .btn-like { background: var(--light); color: var(--gray); border: 1px solid var(--border); }
        .btn-like:hover { background: #fee2e2; color: #ef4444; border-color: #fca5a5; }
        .btn-like.liked { background: #fee2e2; color: #ef4444; border-color: #fca5a5; }

        /* Comments */
        .comments-area { border-top: 1px solid var(--border); padding-top: 15px; }
        .comments-list { max-height: 120px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
        .comments-list::-webkit-scrollbar { width: 4px; }
        .comments-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .comment { background: var(--light); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; }
        .comment strong { color: var(--primary); display: block; margin-bottom: 3px; font-size: 0.8rem; }
        
        .comment-form { display: flex; flex-direction: column; gap: 8px; }
        .comment-input-row { display: flex; gap: 8px; }
        .comment-form input { padding: 8px 12px; font-size: 0.85rem; }
        .comment-form button { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 0 15px; cursor: pointer; }

        /* Toast */
        #toast-box { position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: white; padding: 15px 20px; border-radius: 8px; box-shadow: var(--shadow); border-left: 4px solid var(--primary); animation: slideIn 0.3s forwards; font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .toast.error { border-left-color: #ef4444; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* Skeleton */
        .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f8fafc 50%, #e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius); height: 350px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    </style>
</head>
<body>

    <nav class="navbar">
        <h1><i class="fas fa-layer-group"></i> Renkli Defterim</h1>
    </nav>

    <div id="toast-box"></div>

    <div class="container">
        <div class="upload-card">
            <div class="upload-header"><i class="fas fa-cloud-upload-alt"></i> Yeni PDF Dökümanı Yükle</div>
            
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>PDF Başlığı</label>
                    <input type="text" id="pdfTitle" placeholder="Örn: 7. Sınıf İngilizce Dreams Ünitesi Özeti">
                </div>
                
                <div class="form-group full-width">
                    <label>Açıklama</label>
                    <textarea id="pdfDesc" rows="2" placeholder="Döküman hakkında kısa bilgi..."></textarea>
                </div>

                <div class="form-group">
                    <label>Sınıf</label>
                    <select id="pdfGrade">
                        <option value="5. Sınıf">5. Sınıf</option>
                        <option value="6. Sınıf">6. Sınıf</option>
                        <option value="7. Sınıf">7. Sınıf</option>
                        <option value="8. Sınıf">8. Sınıf</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Ders</label>
                    <select id="pdfSubject">
                        <option value="İngilizce">İngilizce</option>
                        <option value="Matematik">Matematik</option>
                        <option value="Fen Bilimleri">Fen Bilimleri</option>
                        <option value="Diğer">Diğer</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <div class="file-drop-area" onclick="document.getElementById('pdfFile').click()">
                        <i class="fas fa-file-pdf"></i>
                        <p>PDF dosyasını seçmek için tıklayın (Maks 15MB)</p>
                        <div class="file-name" id="fileNameDisplay"></div>
                        <input type="file" id="pdfFile" accept="application/pdf" style="display: none;" onchange="handleFile(event)">
                    </div>
                </div>
            </div>

            <div class="progress-container" id="progressBox">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <button class="btn btn-primary" onclick="uploadPDF()" style="margin-top: 15px;">
                <i class="fas fa-upload"></i> Yüklemeyi Başlat
            </button>
        </div>

        <div class="filter-section">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Döküman ara..." oninput="searchAndFilter()">
            </div>
            <select id="filterGrade" onchange="searchAndFilter()" style="padding: 10px;">
                <option value="Tümü">Tüm Sınıflar</option>
                <option value="5. Sınıf">5. Sınıf</option>
                <option value="6. Sınıf">6. Sınıf</option>
                <option value="7. Sınıf">7. Sınıf</option>
                <option value="8. Sınıf">8. Sınıf</option>
            </select>
            <select id="filterSubject" onchange="searchAndFilter()" style="padding: 10px;">
                <option value="Tümü">Tüm Dersler</option>
                <option value="İngilizce">İngilizce</option>
                <option value="Matematik">Matematik</option>
                <option value="Fen Bilimleri">Fen Bilimleri</option>
                <option value="Diğer">Diğer</option>
            </select>
        </div>

        <div class="pdf-grid" id="pdfGrid">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, increment, arrayUnion, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

        // 🔥 KENDİ BİLGİLERİNİ GİR
        const firebaseConfig = {
            apiKey: "API_KEY",
            authDomain: "XXX.firebaseapp.com",
            projectId: "XXX",
            storageBucket: "XXX.appspot.com",
            appId: "XXX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let allPDFs = [];
        let selectedFile = null;

        // --- YARDIMCI FONKSİYONLAR ---
        window.showToast = (msg, type = 'success') => {
            const box = document.getElementById('toast-box');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${msg}`;
            box.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        // --- YÜKLEME SİSTEMİ ---
        window.handleFile = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.type !== "application/pdf") return showToast("Sadece PDF dosyaları yüklenebilir!", "error");
            if (file.size > 15 * 1024 * 1024) return showToast("Dosya boyutu 15MB'den küçük olmalıdır!", "error");
            
            selectedFile = file;
            const display = document.getElementById('fileNameDisplay');
            display.style.display = 'block';
            display.innerText = `📄 Seçildi: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
        };

        window.uploadPDF = () => {
            const title = document.getElementById('pdfTitle').value.trim();
            const desc = document.getElementById('pdfDesc').value.trim();
            const grade = document.getElementById('pdfGrade').value;
            const subject = document.getElementById('pdfSubject').value;

            if (!title || !selectedFile) return showToast("Başlık ve dosya zorunludur!", "error");

            const storageRef = ref(storage, `pdfs/${Date.now()}_${selectedFile.name}`);
            const uploadTask = uploadBytesResumable(storageRef, selectedFile);
            
            const progressBox = document.getElementById('progressBox');
            const progressBar = document.getElementById('progressBar');
            progressBox.style.display = 'block';

            uploadTask.on('state_changed', 
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    progressBar.style.width = progress + '%';
                }, 
                (error) => { showToast(error.message, "error"); progressBox.style.display = 'none'; }, 
                async () => {
                    const url = await getDownloadURL(uploadTask.snapshot.ref);
                    await addDoc(collection(db, "pdfs"), {
                        title, desc, grade, subject, url, 
                        size: selectedFile.size, likes: 0, comments: [], 
                        createdAt: Date.now()
                    });
                    
                    showToast("PDF başarıyla yüklendi!");
                    
                    // Temizlik
                    document.getElementById('pdfTitle').value = '';
                    document.getElementById('pdfDesc').value = '';
                    selectedFile = null;
                    document.getElementById('fileNameDisplay').style.display = 'none';
                    progressBox.style.display = 'none';
                    progressBar.style.width = '0%';
                }
            );
        };

        // --- GERÇEK ZAMANLI VERİ ÇEKME ---
        const q = query(collection(db, "pdfs"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            allPDFs = [];
            snapshot.forEach(doc => allPDFs.push({ id: doc.id, ...doc.data() }));
            searchAndFilter(); // Veri geldiğinde ekrana çiz
        });

        // --- FİLTRELEME & ÇİZME ---
        window.searchAndFilter = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const grade = document.getElementById('filterGrade').value;
            const subject = document.getElementById('filterSubject').value;

            const filtered = allPDFs.filter(pdf => {
                const matchSearch = pdf.title.toLowerCase().includes(search) || (pdf.desc && pdf.desc.toLowerCase().includes(search));
                const matchGrade = grade === 'Tümü' || pdf.grade === grade;
                const matchSubject = subject === 'Tümü' || pdf.subject === subject;
                return matchSearch && matchGrade && matchSubject;
            });

            renderGrid(filtered);
        };

        const renderGrid = (data) => {
            const grid = document.getElementById('pdfGrid');
            grid.innerHTML = '';
            
            if (data.length === 0) return grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:var(--gray);">Döküman bulunamadı.</p>';

            data.forEach(pdf => {
                const isLiked = localStorage.getItem(`liked_${pdf.id}`);
                
                const commentsHtml = (pdf.comments || []).map(c => `
                    <div class="comment"><strong>${c.user}</strong>${c.text}</div>
                `).join('');

                grid.innerHTML += `
                    <div class="pdf-card">
                        <div class="pdf-badges">
                            <span class="badge badge-grade">${pdf.grade}</span>
                            <span class="badge badge-subject">${pdf.subject}</span>
                        </div>
                        <h3 class="pdf-title">${pdf.title}</h3>
                        <p class="pdf-desc">${pdf.desc || 'Açıklama yok.'}</p>
                        
                        <div class="pdf-actions">
                            <a href="${pdf.url}" target="_blank" class="btn-action btn-view"><i class="fas fa-eye"></i> İncele / İndir</a>
                            <button class="btn-action btn-like ${isLiked ? 'liked' : ''}" onclick="likePDF('${pdf.id}')">
                                <i class="fas fa-heart"></i> ${pdf.likes || 0}
                            </button>
                        </div>

                        <div class="comments-area">
                            <div class="comments-list">${commentsHtml || '<div style="font-size:0.8rem; color:var(--gray); text-align:center;">Henüz yorum yok.</div>'}</div>
                            <div class="comment-form">
                                <input type="text" id="c-name-${pdf.id}" placeholder="Adın">
                                <div class="comment-input-row">
                                    <input type="text" id="c-text-${pdf.id}" placeholder="Yorumun..." style="flex:1;">
                                    <button onclick="addComment('${pdf.id}')"><i class="fas fa-paper-plane"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        };

        // --- ETKİLEŞİM ---
        window.likePDF = async (id) => {
            if (localStorage.getItem(`liked_${id}`)) return showToast("Bu dökümanı zaten beğendiniz.", "error");
            
            await updateDoc(doc(db, "pdfs", id), { likes: increment(1) });
            localStorage.setItem(`liked_${id}`, "true");
        };

        window.addComment = async (id) => {
            const nameInput = document.getElementById(`c-name-${id}`);
            const textInput = document.getElementById(`c-text-${id}`);
            const user = nameInput.value.trim() || 'Öğrenci';
            const text = textInput.value.trim();

            if (!text) return;

            await updateDoc(doc(db, "pdfs", id), {
                comments: arrayUnion({ user, text })
            });
            
            textInput.value = ''; // Inputu temizle
        };

    </script>
</body>
</html>
